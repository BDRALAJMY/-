<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حملة خالد المنصور لرحلات الحج والعمرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #0a0a0a;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #c8a415;
        }
        
        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            display: block;
        }
        
        h1 {
            color: #c8a415;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid #c8a415;
        }
        
        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(200, 164, 21, 0.3);
        }
        
        .link-btn i {
            margin-left: 10px;
            font-size: 24px;
        }
        
        .location {
            background-color: #0a0a0a;
            color: #c8a415;
        }
        
        .location:hover {
            background-color: #151515;
        }
        
        .call {
            background-color: #0a0a0a;
            color: #c8a415;
        }
        
        .call:hover {
            background-color: #151515;
        }
        
        .whatsapp {
            background-color: #0a0a0a;
            color: #c8a415;
        }
        
        .whatsapp:hover {
            background-color: #151515;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #a0a0a0;
            font-size: 14px;
        }
        
        .year {
            margin-top: 10px;
            text-align: center;
            color: #c8a415;
            font-weight: bold;
            font-size: 18px;
        }
        
        /* تحسين للهواتف المحمولة */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .link-btn {
                font-size: 16px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <img src="logo_transparent.png" alt="شعار حملة خالد المنصور" class="logo">
        <h1>حملة خالد المنصور لرحلات الحج والعمرة</h1>
        
        <div class="links">
            <a href="https://maps.app.goo.gl/xbJSmGC67gLhv8RHA?g_st=ic" class="link-btn location" target="_blank">
                <i class="fas fa-map-marker-alt"></i>
                موقع الفندق
            </a>
            
            <a href="tel:+97497399892" class="link-btn call" target="_blank">
                <i class="fas fa-phone"></i>
                اتصال: 97399892
            </a>
            
            <a href="tel:+97455655978" class="link-btn call" target="_blank">
                <i class="fas fa-phone"></i>
                اتصال: 55655978
            </a>
            
            <a href="https://wa.me/97497399892" class="link-btn whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i>
                واتساب: 97399892
            </a>
            
            <a href="https://wa.me/97455655978" class="link-btn whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i>
                واتساب: 55655978
            </a>
        </div>
        
        <div class="footer">تنظيم رحلات الحج والعمرة</div>
        <div class="year">1446 - 2025</div>
    </div>
</body>
</html>
